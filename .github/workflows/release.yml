name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept licenses + install NDK/CMake
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Build debug APK (arm64, signed with debug key, installable)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
          ls -la app/build/outputs/apk/debug/
      - name: Rename + OTA files
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          APK="OnTheGo-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          printf '{\n  "version": "%s",\n  "apk": "%s",\n  "note": "Offline voice-to-text. Tap bubble, speak, get text."\n}\n' "$VER" "$APK" > latest.json
          cat latest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            OnTheGo-*.apk
            latest.json
