name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Accept licenses + install NDK/CMake
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Build release APK (arm64)
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew :app:assembleRelease --stacktrace
      - name: Rename + OTA files
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK="OnTheGo-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sed "s/0\.1\.0/${TAG#v}/g; s/OnTheGo-v0.1.0.apk/$APK/" ota/latest.json > latest.json
          cat latest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            OnTheGo-*.apk
            latest.json
